<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhóm 4 - Bài tập & Thành viên</title>

<style>
  :root{
    --accent:#60a5fa; --bg:#f5f8ff; --card:#d6f0ff; --muted:#000; --radius:14px; --maxw:980px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
    background:url("https://github.com/user-attachments/assets/ef70f834-1169-4741-8e8c-10a0b1650724")
      no-repeat center center fixed;
    background-size:cover;
    color:#e2e8f0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* NAVBAR */
  .navbar{
    width:100%;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(5px);
    position:sticky; top:0; z-index:999;
    padding:10px 0;
  }
  .nav-container{
    max-width:var(--maxw);
    margin:0 auto;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 20px;
  }
  .nav-logo{font-size:20px;font-weight:700;color:white;text-decoration:none;}
  .nav-links{display:flex;gap:18px;}
  .nav-links a{
    color:#e2e8f0;text-decoration:none;font-weight:500;
    padding:6px 10px;border-radius:6px;transition:0.25s;
  }
  .nav-links a:hover{background:rgba(255,255,255,0.16);}
  .dropdown{position:relative;display:inline-block;}
  .dropdown-content{
    display:none;
    position:absolute;
    background:rgba(0,0,0,0.7);
    min-width:180px;
    border-radius:8px;
  }
  .dropdown:hover .dropdown-content{display:block;}
  .dropdown-content a{
    color:white; padding:8px 12px; display:block; text-decoration:none;
  }

  .wrap{width:100%; max-width:var(--maxw); margin-top:20px;}

  /* 🌈 BANNER CHUYỂN MÀU */
  .banner{
    width:100%;
    padding:26px 10px;
    margin-bottom:20px;
    text-align:center;
    font-size:32px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;

    background:linear-gradient(
      120deg,
      rgba(255,255,255,0.85),
      rgba(120,190,255,0.45),
      rgba(255,255,255,0.85)
    );
    background-size:300% 300%;
    animation:gradientShift 6s ease-in-out infinite;

    color:#002236;
    border-radius:18px;
    box-shadow:0 10px 32px rgba(0,0,0,0.25);
    backdrop-filter:blur(6px);
  }
  @keyframes gradientShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  /* CARD */
  .grid{display:grid;grid-template-columns:1fr;gap:20px;}
  .card{
    background:var(--card);
    padding:18px;
    border-radius:var(--radius);
    box-shadow:0 8px 28px rgba(2,6,23,0.06);
    color:#003a65!important;
  }
  .section-title{margin-bottom:12px;}

  /* MEMBERS GRID */
  .members{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
  }

  .member-card{
    display:flex; gap:16px;
    background:#60a5fa;
    border-radius:16px;
    padding:18px; 
    color:white;
    text-decoration:none;
    transition:0.3s;
  }
  .member-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,0.25);}
  .mc-avatar-img{width:70px;height:70px;border-radius:50%;object-fit:cover;}

  /* LINKS – xếp dọc */
  .list-links{
    display:flex; flex-direction:column; gap:12px;
  }
  .link-btn{
    padding:12px 14px;
    background:rgba(255,255,255,0.15);
    border-radius:10px;
    color:#003a65;
    font-weight:600;
    text-decoration:none;
    transition:0.25s;
  }
  .link-btn:hover{background:rgba(255,255,255,0.3);}

  /* FORM */
  form .row{margin-bottom:10px;}
  input, textarea, select{
    width:100%; padding:10px 12px;
    border-radius:10px; border:1px solid rgba(255,255,255,0.3);
    background:transparent; color:#003a65; outline:none;
  }
  button.primary{
    background:linear-gradient(90deg,var(--accent),#60a5fa);
    color:#04202a; padding:10px 14px;
    border:none; border-radius:10px;
    font-weight:700; cursor:pointer;
  }

  /* FOOTER MỚI */
  .footer {
    width: 100%;
    margin-top: 30px;
    padding: 20px 10px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    border-radius: 14px;
    color: #e2e8f0;
  }

  .footer-content {
    max-width: 980px;
    margin: 0 auto;
    text-align: center;
  }

  .footer a {
    color: #60a5fa;
    text-decoration: none;
  }

  .footer a:hover {
    text-decoration: underline;
  }
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-container">
    <a href="#" class="nav-logo">Nhóm 4</a>
    <div class="nav-links">
      <a href="#">Trang chủ</a>

      <div class="dropdown">
        <a class="dropbtn">Thành viên</a>
        <div class="dropdown-content" id="navMembers"></div>
      </div>

      <div class="dropdown">
        <a class="dropbtn">Bài tập</a>
        <div class="dropdown-content" id="navLinks"></div>
      </div>

      <a href="#contactForm">Gửi ý kiến</a>
    </div>
  </div>
</nav>

<div class="wrap">

  <!-- 🌈 BANNER -->
  <div class="banner">Báo cáo tin học</div>

  <main class="grid">

    <!-- THÀNH VIÊN -->
    <div class="card">
      <div class="section-title"><h2>Thành viên</h2></div>
      <div class="members" id="members"></div>
    </div>

    <!-- BÀI TẬP -->
    <div class="card">
      <div class="section-title"><h2>Bài tập & tài liệu</h2></div>
      <div class="list-links" id="links"></div>
    </div>

    <!-- FORM -->
    <div class="card">
      <div class="section-title"><h2>Form gửi ý kiến</h2></div>
      <form id="contactForm" onsubmit="return handleSubmit(event)">
        <div class="row"><input type="text" id="name" placeholder="Họ & tên" required></div>
        <div class="row"><input type="email" id="email" placeholder="Email (không bắt buộc)"></div>
        <div class="row">
          <select id="topic">
            <option value="phanhoi">Phản hồi</option>
            <option value="nopbai">Nộp bài</option>
            <option value="yeucau">Yêu cầu</option>
          </select>
        </div>
        <div class="row"><textarea id="message" placeholder="Nội dung" required></textarea></div>
        <div class="row"><button class="primary" type="submit">Gửi</button></div>
      </form>
    </div>

  </main>

  <!-- 🌟 FOOTER MỚI -->
  <footer class="footer">
    <div class="footer-content">
      <p class="copyright">
        © Nhóm 4 - Demo Web.
      </p>

      <p><strong>Địa chỉ:</strong> Nguyễn Văn Cánh, Phú Hưng, Bến Tre</p>

      <p><strong>Số điện thoại:</strong> 
        <a href="tel:0275 3822 313">0275 3822 313</a>
      </p>

      <p><strong>Email:</strong> 
         <a href="mailto:nhom4.12v@gmail.com">nhom4.12v@gmail.com</a>
      </p>
    </div>
  </footer>

</div>

<script>
// MEMBERS
const members=[
  {name:'Nguyễn Huỳnh Đăng Thư', cls:'12 Văn', about:'Tổng hợp nội dung, luôn chill 😎', photo:'Đăng Thư.png', link:'https://dangthunguyenhuynh43-ui.github.io/-thuw/#'},
  {name:'Trần Lê Yến Như', cls:'12 Văn', about:'Mang vibe riêng đầy năng lượng ✨', photo:'Yến Như.png', link:'https://nt4620567-byte.github.io/Nhu/'},
  {name:'Nguyễn Phạm Quế Anh', cls:'12 Văn', about:'Thiết kế slide & hình ảnh 🎨', photo:'Quế Anh.png', link:'https://queanh1101.github.io/'},
  {name:'Nguyễn Huỳnh Ngọc Châu', cls:'12 Văn', about:'Kiểm tra bài 📝', photo:'Ngọc Châu.png', link:'https://nt4620567-byte.github.io/Ch-u-/'},
  {name:'Đỗ Quốc Việt', cls:'12 Văn', about:'Tổng hợp tài liệu 💻', photo:'QV.jpg', link:'https://doquocviet52.github.io/doquocvietprofile.github.io/'}
];
members.forEach(m=>{
  const card=document.createElement("a");
  card.className="member-card"; card.href=m.link; card.target="_blank";
  card.innerHTML=`<img class="mc-avatar-img" src="${m.photo}">
    <div><h3>${m.name}</h3><p>Lớp ${m.cls}</p><p>${m.about}</p></div>`;
  document.getElementById("members").appendChild(card);

  const nav=document.createElement("a");
  nav.href=m.link; nav.target="_blank"; nav.textContent=m.name;
  document.getElementById("navMembers").appendChild(nav);
});

// LINKS
const links=[
  {title:'Bài 7: HTML và cấu trúc trang web', href:'https://nt4620567-byte.github.io/BAI7/'},
  {title:'Bài 8: Định dạng văn bản', href:'https://dangthunguyenhuynh43-ui.github.io/BAI8/'},
  {title:'Bài 9: Tạo danh sách, bảng', href:'https://nguyenhuynhngocchau2508-ops.github.io/tin9.html/'},
  {title:'Bài 10: Tạo liên kết', href:'https://nt4620567-byte.github.io/Baitin_12v/'},
  {title:'Bài 11: Chèn tệp đa phương tiện', href:'https://queanh1101.github.io/Bai11.github.io/'},
  {title:'Bài 12: Tạo biểu mẫu', href:'https://doquocviet52.github.io/TInHocBai12/'},
  {title:'Bài 13: Khái niệm, vai trò của CSS', href:'https://nt4620567-byte.github.io/Bai14tin/'},
  {title:'Bài 14: Định dạng văn bản bằng CSS', href:'https://queanh1101.github.io/bai14.github.io/'},
  {title:'Bài 15: Tạo màu cho chữ và nền', href:'https://doquocviet52.github.io/tinhocbai15/'},
  {title:'Bài 16: Định dạng khung', href:'https://nt4620567-byte.github.io/Tinbai16/'}, 
  {title:'Bài 17: Các mức ưu tiên của bộ chọn', href:'https://queanh1101.github.io/Bai17.github.io/'},
  {title:'Bài 18: Thực hành tổng hợp thiết kế trang web', href:'https://nguyenhuynhngocchau2508-ops.github.io/index.html/'},
  {title:'Bài 19: Dịch vụ sửa chữa và bảo trì máy tính', href:'https://www.canva.com/design/DAG-rs5jqgg/PQzXqg-v6PULZRgYWPtyWw/edit?fbclid=IwY2xjawPZUhRleHRuA2FlbQIxMQBzcnRjBmFwcF9pZAEwAAEebi70T3g9aAk6Ir-MTaWU4nsb_EfwVo6GoAF4915bQvXu777GnDG6MdP5-NA_aem_vGh9_6y-Dfe0DykZapslPA'},
  {title:'Bài 20: Nhóm nghề quản trị trong ngàng công nghệ thông tin', href:'https://www.canva.com/design/DAG-uwFi03E/zV1584MAglnoXEEOtnz_3A/edit?utm_content=DAG-uwFi03E&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutton'}
];
links.forEach(l=>{
  const a=document.createElement("a");
  a.className="link-btn"; a.href=l.href; a.target="_blank"; a.textContent=l.title;
  document.getElementById("links").appendChild(a);

  const nav=document.createElement("a");
  nav.href=l.href; nav.target="_blank"; nav.textContent=l.title;
  document.getElementById("navLinks").appendChild(nav);
});

// FORM
function handleSubmit(e){
  e.preventDefault();
  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const topic=document.getElementById("topic").value;
  const msg=document.getElementById("message").value.trim();
  if(!name||!msg){alert("Vui lòng điền tên và nội dung.");return;}
  alert(`Cảm ơn ${name}!\nChủ đề: ${topic}\nEmail: ${email||"(không có)"}\nNội dung: ${msg}`);
  document.getElementById("contactForm").reset();
}
</script>

</body>
</html>
